      // Функции для интерактивности маркировки
      function highlightGroup(groupNumber) {
        // Подсвечиваем группу в маркировке
        const markGroups = document.querySelectorAll('.mark-group');
        markGroups.forEach(group => {
          if (group.getAttribute('data-group') == groupNumber) {
            group.style.backgroundColor = '#ffeb3b';
            group.style.color = '#000';
          }
        });
        
        // Подсвечиваем соответствующую расшифровку
        const explanationGroups = document.querySelectorAll('.explanation-group');
        explanationGroups.forEach(group => {
          if (group.getAttribute('data-group') == groupNumber) {
            group.style.backgroundColor = '#ffeb3b';
            group.style.color = '#000';
          }
        });
      }
      
      function unhighlightGroup() {
        // Убираем подсветку с маркировки
        const markGroups = document.querySelectorAll('.mark-group');
        markGroups.forEach(group => {
          group.style.backgroundColor = '';
          group.style.color = '';
        });
