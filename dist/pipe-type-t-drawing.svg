<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .dimension { font-family: Arial, sans-serif; font-size: 10px; fill: #374151; }
      .center-line { stroke: #6b7280; stroke-width: 1; stroke-dasharray: 5,5; }
      .outline { stroke: #374151; stroke-width: 2; fill: none; }
      .highlight { stroke: #3b82f6; stroke-width: 3; fill: none; }
      .section-fill { fill: #f3f4f6; }
      .pipe-fill { fill: #d1d5db; }
    </style>
  </defs>
  
  <!-- Заголовок -->
  <text x="400" y="20" text-anchor="middle" class="title">Труба ж/б Т 100.50-3</text>
  
  <!-- Изометрическая проекция (левая часть) -->
  <g transform="translate(50, 80)">
    <!-- Основная труба -->
    <ellipse cx="60" cy="60" rx="50" ry="25" class="outline" fill="#e5e7eb"/>
    <ellipse cx="60" cy="60" rx="40" ry="20" class="outline" fill="white"/>
    
    <!-- Раструб -->
    <ellipse cx="120" cy="60" rx="60" ry="30" class="outline" fill="#e5e7eb"/>
    <ellipse cx="120" cy="60" rx="50" ry="25" class="outline" fill="white"/>
    
    <!-- Соединение -->
    <line x1="110" y1="60" x2="70" y2="60" class="outline"/>
    
    <!-- Размеры -->
    <text x="60" y="100" class="dimension">Ø1200</text>
    <text x="120" y="100" class="dimension">Ø1450</text>
  </g>
  
  <!-- Поперечный разрез (центральная часть) -->
  <g transform="translate(250, 80)">
    <!-- Основная труба -->
    <rect x="0" y="40" width="200" height="100" class="outline" fill="#f3f4f6"/>
    <rect x="20" y="50" width="160" height="80" class="outline" fill="white"/>
    
    <!-- Раструб с уступом -->
    <rect x="200" y="20" width="125" height="140" class="outline" fill="#f3f4f6"/>
    <rect x="200" y="30" width="110" height="120" class="outline" fill="white"/>
    <rect x="200" y="20" width="200" height="20" class="outline" fill="#f3f4f6"/>
    
    <!-- Размеры -->
    <line x1="0" y1="30" x2="0" y2="35" class="outline"/>
    <line x1="200" y1="30" x2="200" y2="35" class="outline"/>
    <line x1="0" y1="32.5" x2="200" y2="32.5" class="outline"/>
    <text x="100" y="25" text-anchor="middle" class="dimension">200</text>
    
    <line x1="200" y1="10" x2="200" y2="15" class="outline"/>
    <line x1="325" y1="10" x2="325" y2="15" class="outline"/>
    <line x1="200" y1="12.5" x2="325" y2="12.5" class="outline"/>
    <text x="262.5" y="5" text-anchor="middle" class="dimension">125</text>
    
    <!-- Вертикальные размеры -->
    <line x1="210" y1="0" x2="215" y2="0" class="outline"/>
    <line x1="210" y1="160" x2="215" y2="160" class="outline"/>
    <line x1="212.5" y1="0" x2="212.5" y2="160" class="outline"/>
    <text x="225" y="80" class="dimension">1450</text>
    
    <line x1="230" y1="20" x2="235" y2="20" class="outline"/>
    <line x1="230" y1="140" x2="235" y2="140" class="outline"/>
    <line x1="232.5" y1="20" x2="232.5" y2="140" class="outline"/>
    <text x="245" y="80" class="dimension">1230</text>
    
    <line x1="250" y1="40" x2="255" y2="40" class="outline"/>
    <line x1="250" y1="140" x2="255" y2="140" class="outline"/>
    <line x1="252.5" y1="40" x2="252.5" y2="140" class="outline"/>
    <text x="265" y="90" class="dimension">1000</text>
    
    <line x1="270" y1="40" x2="275" y2="40" class="outline"/>
    <line x1="270" y1="140" x2="275" y2="140" class="outline"/>
    <line x1="272.5" y1="40" x2="272.5" y2="140" class="outline"/>
    <text x="285" y="90" class="dimension">1200</text>
    
    <!-- Выделение угла -->
    <circle cx="200" cy="20" r="8" class="highlight"/>
  </g>
  
  <!-- Вид сверху (правая часть) -->
  <g transform="translate(550, 80)">
    <!-- Внешний диаметр -->
    <circle cx="80" cy="80" r="60" class="outline" fill="#f3f4f6"/>
    <!-- Внутренний диаметр -->
    <circle cx="80" cy="80" r="40" class="outline" fill="white"/>
    
    <!-- Центральные линии -->
    <line x1="20" y1="80" x2="140" y2="80" class="center-line"/>
    <line x1="80" y1="20" x2="80" y2="140" class="center-line"/>
    
    <!-- Размеры -->
    <text x="80" y="160" text-anchor="middle" class="dimension">Ø1000</text>
    <text x="80" y="175" text-anchor="middle" class="dimension">1450</text>
  </g>
  
  <!-- Подписи проекций -->
  <text x="150" y="200" text-anchor="middle" class="dimension">Изометрия</text>
  <text x="400" y="200" text-anchor="middle" class="dimension">Поперечный разрез</text>
  <text x="650" y="200" text-anchor="middle" class="dimension">Вид сверху</text>
</svg>
